name: Build Xiaomi SDM660 Kernel

on:
  push:
    branches: [ halium-9.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_ARM32: arm-linux-gnueabi-
      KERNEL_OUTPUT: out
      DEFCONFIG: wayne-perf_defconfig

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install cross-compilers
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi

    - name: Configure kernel
      run: |
        make \
          O=$KERNEL_OUTPUT \
          ARCH=$ARCH \
          CROSS_COMPILE=$CROSS_COMPILE \
          ${{ env.DEFCONFIG }}

    - name: Build kernel (verbose)
      run: |
        make -j$(nproc) \
          O=$KERNEL_OUTPUT \
          ARCH=$ARCH \
          CROSS_COMPILE=$CROSS_COMPILE \
          CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
          V=1 2>&1 | tee build.log
    - name: Upload build log
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
         
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: |
          ${{ env.KERNEL_OUTPUT }}/arch/arm64/boot/Image.gz-dtb
          ${{ env.KERNEL_OUTPUT }}/Module.symvers
